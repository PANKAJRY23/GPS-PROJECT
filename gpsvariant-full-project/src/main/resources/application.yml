spring:
  application:
    name: gpsvariant

  jpa:
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:20MB}

  mail:
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}
            required: ${MAIL_SMTP_STARTTLS_REQUIRED:true}

server:
  forward-headers-strategy: framework

  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}
        name: GPSVARIANT_SESSION

app:
  max-upload-bytes: ${MAX_UPLOAD_BYTES:10485760}

  password-reset:
    expiry-minutes: ${PASSWORD_RESET_EXPIRY_MINUTES:15}
    cleanup-ms: ${PASSWORD_RESET_CLEANUP_MS:3600000}

  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:${MAIL_USERNAME:}}

security:
  allowed-image-types: ${ALLOWED_IMAGE_TYPES:image/jpeg,image/png,image/webp}

google:
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.gpsvariant: ${LOG_LEVEL_APP:INFO}
