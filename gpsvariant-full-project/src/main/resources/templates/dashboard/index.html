<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>GPSVariant</title>

    <link rel="stylesheet" href="/css/style.css">

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

</head>

<body>

<!-- TOP BAR -->

<div class="topbar">

    <h2>GPSVariant</h2>

    <!-- LOGOUT -->
    <form th:action="@{/logout}" method="post" class="logout-form">
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <button type="submit" class="logout-btn">
            Logout
        </button>
    </form>

</div>

<!-- MAIN CONTAINER -->

<div class="main-container">

<form id="gpsForm">

<div class="dashboard">

    <!-- LEFT PANEL -->

    <div class="left-panel">

        <div class="upload-row">

            <span class="label">
                Main Image:
            </span>

            <input type="file"
                   id="mainImageInput"
                   name="file"
                   accept="image/*">

            <button type="button"
                    class="small-btn"
                    onclick="uploadMainImage()">

                Done

            </button>

        </div>

        <!-- IMAGE PREVIEW -->

        <div class="image-preview">

            <img id="previewImage"
                 style="display:none;">

            <span id="placeholderText">

                MAIN IMAGE

            </span>

        </div>

    </div>

    <!-- CENTER PANEL -->

    <div class="center-panel">

        <div class="form-title">

            Location & Time:

        </div>

		<div class="form-group">

		    <input type="text"
		           id="location"
		           value="Mumbai, Maharashtra"
		           readonly>

		</div>

        <div class="form-group">

            <input type="text"
                   id="address1"
                   placeholder="Address Line 1">

        </div>

        <div class="form-group">

            <input type="text"
                   id="address2"
                   placeholder="Address Line 2">

        </div>

        <div class="form-group">

            <input type="text"
                   id="latitude"
                   name="latitude"
                   placeholder="Ex: Lat N 19° 14' 50.74368">

        </div>

        <div class="form-group">

            <input type="text"
                   id="longitude"
                   name="longitude"
                   placeholder="Ex: Long E 72° 52' 2.72352">

        </div>

        <div class="form-group">

            <input type="text"
                   id="dateTime"
                   placeholder="Ex: 14/10/20 03:01 PM">

        </div>

        <button type="button"
                class="done-btn"
                onclick="generateMapPreview()">

            Done

        </button>

    </div>

    <!-- RIGHT PANEL -->

    <div class="right-panel">

        <div class="label">

            Map Image:

        </div>

        <!-- MAP PREVIEW -->

        <div class="map-preview">

			<img id="mapPreview"
			     style="display:none;
			            width:100%;
			            height:100%;
			            object-fit:cover;">
                <span id="mapPlaceholder">
						MAP IMAGE

            </span>

        </div>

        <div class="upload-row"
             style="margin-top:20px;">

            <input type="file"
                   id="mapImageInput"
                   accept="image/*">

				   <button type="button"
				           class="small-btn"
				           onclick="uploadSecondImage()">

				       Done

				   </button>

        </div>

    </div>

</div>

<!-- SAVE BUTTON -->

<div class="save-wrapper">

    <button class="save-btn"
            type="button"
            onclick="saveGpsData()">

        Save

    </button>

</div>

</form>

</div>

<!-- JAVASCRIPT -->

<script>

let secondImageId = null;	

let uploadedImagePath = "";

let uploadedImageId = null;

let mapImagePath = "";

let secondImagePath = "";

function getCookie(name) {
    const prefix = name + "=";
    const cookie = document.cookie.split(";").map(c => c.trim()).find(c => c.startsWith(prefix));
    return cookie ? decodeURIComponent(cookie.substring(prefix.length)) : "";
}

function csrfHeaders() {
    const token = getCookie("XSRF-TOKEN");
    return token ? { "X-XSRF-TOKEN": token } : {};
}
/*

/*
-------------------------------------
UPLOAD MAIN IMAGE
-------------------------------------
*/

async function uploadMainImage(){

    // GET FILE INPUT

    const fileInput =
        document.getElementById("mainImageInput");

    // GET SELECTED FILE

    const file =
        fileInput.files[0];

    // VALIDATION

    if(!file){

        alert("Please select image");

        return;
    }

    // IMAGE PREVIEW

    const preview =
        document.getElementById("previewImage");

    preview.src =
        URL.createObjectURL(file);

    preview.style.display =
        "block";

    // HIDE PLACEHOLDER TEXT

    document.getElementById("placeholderText")
        .style.display = "none";

    // CREATE FORMDATA

    const formData =
        new FormData();

    formData.append("file", file);

    try{

        // API CALL

        const response =
            await fetch("/api/image/upload",{

                method:"POST",
                headers: csrfHeaders(),
                body: formData

            });

        // CHECK RESPONSE

        if(!response.ok){

            throw new Error("Upload Failed");

        }

        // CONVERT RESPONSE JSON

        const result =
            await response.json();

        console.log(result);

        /*
        --------------------------------
        STORE IMAGE DATA
        --------------------------------
        */

        uploadedImagePath =
            result.imagePath;

        uploadedImageId =
            result.imageId;

        console.log(
            "Uploaded Image ID:",
            uploadedImageId
        );

        console.log(
            "Uploaded Image Path:",
            uploadedImagePath
        );

        // SUCCESS MESSAGE

        alert("Image Uploaded Successfully");

    }catch(error){

        console.error(error);

        alert("Error Uploading Image");

    }

}

async function generateMapPreview() {

    const latitude = document.getElementById("latitude").value;
    const longitude = document.getElementById("longitude").value;
    const address1 = document.getElementById("address1").value;
    const address2 = document.getElementById("address2").value;

    if (!uploadedImageId) {
        alert("Please upload the main image first.");
        return;
    }

    if (!latitude || !longitude) {
        alert("Please enter latitude & longitude");
        return;
    }

    try {

        const response = await fetch("/api/map/generate", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                ...csrfHeaders()
            },
            body: JSON.stringify({
                imageId: uploadedImageId,
                latitude: latitude,
                longitude: longitude,
                address1: address1,
                address2: address2
            })
        });

        console.log("Response Status:", response.status);

        if (!response.ok) {
            throw new Error("Map Generation Failed");
        }

        const result = await response.json();

        console.log("Response JSON:", result);
		
		mapImagePath = result.mapImagePath;

		console.log(
		    "Generated Map Image Path:",
		    mapImagePath
		);

        const mapPreview = document.getElementById("mapPreview");
        const mapPlaceholder = document.getElementById("mapPlaceholder");

        console.log("mapPreview:", mapPreview);
        console.log("mapPlaceholder:", mapPlaceholder);

        if (!mapPreview) {
            throw new Error("mapPreview element not found.");
        }

        if (!result.mapImagePath) {
            throw new Error("mapImagePath not received from backend.");
        }

        mapPreview.src = result.mapImagePath;

        mapPreview.onload = function () {
            console.log("Map image loaded successfully.");
        };

        mapPreview.onerror = function () {
            console.error("Unable to load image: " + mapPreview.src);
        };

        mapPreview.style.display = "block";

        if (mapPlaceholder) {
            mapPlaceholder.style.display = "none";
        }

        alert("Map Generated Successfully");

    } catch (error) {

        console.error("Generate Map Error:", error);

        alert("Error: " + error.message);
    }
}

/*
-------------------------------------
SAVE GPS DATA
-------------------------------------
*/

async function uploadSecondImage(){

    const fileInput =
        document.getElementById("mapImageInput");


    const file =
        fileInput.files[0];


    if(!file){

        alert("Please select image");

        return;
    }


    const formData =
        new FormData();


    formData.append(
        "file",
        file
    );


    try{


        const response =
            await fetch("/api/image/upload",{

                method:"POST",
                headers: csrfHeaders(),
                body:formData

            });


        if(!response.ok){

            throw new Error(
                "Upload Failed"
            );

        }


        const result =
            await response.json();


			secondImageId =
			    result.imageId;


			secondImagePath =
			    result.imagePath;


			console.log(
			    "Second Image ID:",
			    secondImageId
			);


        console.log(
            "Second Image Path:",
            secondImagePath
        );


        alert(
            "Second Image Uploaded Successfully"
        );


    }
    catch(error){

        console.error(error);

        alert(
            "Error Uploading Second Image"
        );

    }

}

async function saveGpsData(){
	
	if(!uploadedImageId){

	      alert(
	          "Image ID missing. Please upload main image again."
	      );

	      return;

	  }

    const latitude =
        document.getElementById("latitude").value;

    const longitude =
        document.getElementById("longitude").value;

    const location =
        document.getElementById("location").value;

    const address1 =
        document.getElementById("address1").value;

    const address2 =
        document.getElementById("address2").value;

    const dateTime =
        document.getElementById("dateTime").value;

		const payload = {


		    mainImageId: uploadedImageId,


		    secondImageId: secondImageId,


		    mapImagePath: mapImagePath,


		    latitude: latitude,


		    longitude: longitude,


		    address1: address1,


		    address2: address2,


		    location: location,


		    dateTime: dateTime

		};
		
    try{

        const response =
            await fetch("/api/map/save",{

                method:"POST",

                headers:{
                    "Content-Type":"application/json",
                    ...csrfHeaders()
                },

                body: JSON.stringify(payload)

            });

        if(!response.ok){

            throw new Error("Save Failed");

        }

        const result =
            await response.text();

        console.log(result);

        alert("GPS Data Saved Successfully");

    }catch(error){

        console.error(error);

        alert("Error Saving Data");

    }

}

</script>

</body>

</html>
